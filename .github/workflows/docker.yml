name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'modules/ui/**'
      - 'deploy/**'
      - 'release/version.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.18.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build UI library & Frontend
        run: |
          cd modules/ui
          pnpm install --no-frozen-lockfile
          pnpm build
          cd ../../frontend
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Extract build metadata
        id: build_meta
        shell: ruby {0}
        run: |
          require File.expand_path('.github/scripts/release-metadata.rb')
          version = ReleaseMetadata.version(YAML.load_file('release/version.yaml').fetch('version'))
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
            output.puts "version=#{version}"
            output.puts "build_time=#{Time.now.utc.iso8601}"
          end

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CPR_VERSION=${{ steps.build_meta.outputs.version }}
            CPR_GIT_SHA=${{ github.sha }}
            CPR_BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            CPR_BUILD_TYPE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
